<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CSI Cases | Student Games</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#101827;color:#f8fafc;margin:0}header{padding:22px 18px;background:#1e293b}h1{margin:0;font-size:1.6rem}p{color:#cbd5e1}main{max-width:1100px;margin:auto;padding:20px}.cases{display:flex;flex-wrap:wrap;gap:10px}button{background:#0ea5e9;color:#04121e;border:0;border-radius:9px;padding:14px 20px;font-weight:750;font-size:1rem;cursor:pointer}button[aria-pressed=true]{background:#facc15}.frame{margin-top:18px;background:black;min-height:400px;aspect-ratio:4/3;max-height:80vh}ruffle-player{width:100%;height:100%;display:block}.note{font-size:.9rem}a{color:#7dd3fc}</style><script src="https://unpkg.com/@ruffle-rs/ruffle"></script></head><body><header><h1>CSI Interactive Cases</h1><p>Choose a case to begin.</p></header><main><div class="cases" id="cases"></div><div class="frame" id="game" aria-label="Game player"></div><p class="note">Some older Flash activities may not work with Ruffle or touch controls. An internet connection is required.</p></main><script>const cases=document.getElementById('cases'),container=document.getElementById('game');function launch(n){cases.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.case)===n)));container.replaceChildren();const r=window.RufflePlayer;if(!r){container.textContent='Ruffle could not load. Check your internet connection or district filtering.';return;}const player=r.newest().createPlayer();container.appendChild(player);player.load({url:`case${n}/game.swf`,allowScriptAccess:false,autoplay:'on',unmuteOverlay:'visible'}).catch(e=>{console.error(e);container.insertAdjacentText('beforeend',' Game could not load.');});}for(let n=1;n<=5;n++){const b=document.createElement('button');b.textContent=`Case ${n}`;b.dataset.case=n;b.setAttribute('aria-pressed','false');b.addEventListener('click',()=>launch(n));cases.appendChild(b);}launch(1);</script></body></html>
